version: "2"

linters:
  default: standard
  enable:
    - misspell
    - gocritic
    - revive
    - unconvert
    - prealloc
    - copyloopvar
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - gocritic
          - prealloc
          - errcheck
      - linters:
          - staticcheck
        text: "SA6002"

formatters:
  enable:
    - gofmt
