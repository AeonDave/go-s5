version: "2"

linters:
  default: standard
  enable:
    - misspell
    - gocritic
    - revive
    - unconvert
    - prealloc
    - copyloopvar
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - gocritic
          - prealloc
          - errcheck
      # Internal packages are not part of the public API surface; doc comments
      # there are encouraged but not enforced.
      - path: "^internal/|/internal/|^cmd/"
        linters:
          - revive
        text: "exported|package-comments"
      - linters:
          - staticcheck
        text: "SA6002"

formatters:
  enable:
    - gofmt
